stages:
  - build
  - publish

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "product"'
    - when: never

build_electron:
  stage: build
  tags:
    - electron
  interruptible: true
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  script:
    - |
      $ErrorActionPreference = 'Stop'
      Write-Host "Node: $(node --version)"
      Write-Host "npm: $(npm --version)"

      if (Test-Path -LiteralPath 'dist_electron') {
        Remove-Item -LiteralPath 'dist_electron' -Recurse -Force
      }
    - npm ci --prefer-offline --no-audit
    - |
      if ($LASTEXITCODE -ne 0) {
        throw "npm ci failed with exit code $LASTEXITCODE."
      }
    - npm run electron:build
    - |
      if ($LASTEXITCODE -ne 0) {
        throw "Electron build failed with exit code $LASTEXITCODE."
      }

      $version = (node -p "require('./package.json').version").Trim()
      if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
        throw 'Could not read a valid version from package.json.'
      }

      $installers = @(Get-ChildItem -LiteralPath 'dist_electron' -File -Filter '*.exe')
      if ($installers.Count -eq 0) {
        throw 'No Windows installer was produced in dist_electron.'
      }

      Write-Host "Built AT Digital Tester $version"
      Get-ChildItem -LiteralPath 'dist_electron' -Recurse | Format-Table -AutoSize
  artifacts:
    name: "ATDigitalTester-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist_electron/
    expire_in: 30 days

publish_update_package:
  stage: publish
  tags:
    - electron
  interruptible: true
  needs:
    - job: build_electron
      artifacts: true
  script:
    - |
      $ErrorActionPreference = 'Stop'

      $version = (node -p "require('./package.json').version").Trim()
      if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
        throw 'Could not read a valid version from package.json.'
      }

      $installerName = "AT-Digital-Tester-Setup-$version.exe"
      $blockmapName = "$installerName.blockmap"
      $latestFiles = @(Get-ChildItem -LiteralPath 'dist_electron' -Recurse -File | Where-Object { $_.Name -ceq 'latest.yml' })
      $installers = @(Get-ChildItem -LiteralPath 'dist_electron' -Recurse -File | Where-Object { $_.Name -ceq $installerName })
      $blockmaps = @(Get-ChildItem -LiteralPath 'dist_electron' -Recurse -File | Where-Object { $_.Name -ceq $blockmapName })

      if ($latestFiles.Count -ne 1) {
        throw "Expected exactly one latest.yml, found $($latestFiles.Count)."
      }
      if ($installers.Count -ne 1) {
        throw "Expected exactly one installer named '$installerName', found $($installers.Count)."
      }
      if ($blockmaps.Count -ne 1) {
        throw "Expected exactly one blockmap named '$blockmapName', found $($blockmaps.Count)."
      }

      $packageName = 'at-digital-tester'
      $packageBaseUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/$packageName/$version"
      $headers = @{ 'JOB-TOKEN' = $env:CI_JOB_TOKEN }
      $files = @($latestFiles + $installers + $blockmaps)

      foreach ($file in $files) {
        $encodedName = [Uri]::EscapeDataString($file.Name)
        $uploadUrl = "$packageBaseUrl/$encodedName"
        Write-Host "Publishing $($file.Name) to package $packageName/$version"
        Invoke-WebRequest -Uri $uploadUrl -Method Put -Headers $headers -InFile $file.FullName -UseBasicParsing | Out-Null
      }

      Write-Host "Published AT Digital Tester update package version $version."
